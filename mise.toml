[tools]
python = "3.14"

uv = "latest"
direnv = "latest"
gitleaks = "latest"
"github:casey/just" = "latest"

[bootstrap.packages]
"apt:zsh" = { os = "linux" }

[settings]
python.uv_venv_auto = "create|source"
# Linux and macOS only. Windows lock entries break direnv upgrades when the
# release asset is renamed (direnv.windows-amd64 -> direnv.windows-amd64.exe).
lockfile_platforms = [
  "linux-x64",
  "linux-x64-musl",
  "linux-arm64",
  "linux-arm64-musl",
  "macos-x64",
  "macos-arm64",
]
